<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гос Органы РК</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#eef2f7,#dce6f3);
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#1e2a38;
}

/* TOP BAR */
.top-bar{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

input[type="text"], input[type="date"]{
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
    flex:1;
    min-width:220px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

/* BUTTONS */
.add-btn{
    background:#27ae60;
    color:white;
}

.add-btn:hover{
    background:#1f8c4c;
}

.search-btn{
    background:#2980b9;
    color:white;
}

.search-btn:hover{
    background:#1d6591;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,0.08);
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:center;
}

th{
    background:#2c3e50;
    color:white;
}

tr:hover{
    background:#f9fbfd;
}

img{
    width:90px;
    height:65px;
    object-fit:cover;
    border-radius:10px;
}

/* MODAL */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    width:450px;
    padding:25px;
    border-radius:20px;
}

.modal-content h2{
    text-align:center;
    margin-bottom:15px;
}

.form-group{
    margin-bottom:10px;
}

input, textarea{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

.save-btn{
    width:100%;
    margin-top:10px;
    background:#2980b9;
    color:white;
}

/* BOTTOM ACTIONS */
.bottom-actions{
    margin-top:20px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.bottom-btn{
    padding:12px 18px;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

.edit-bottom{ background:#f39c12; }
.delete-bottom{ background:#e74c3c; }
.cancel-bottom{ background:#7f8c8d; }

</style>
</head>

<body>

<h1>База данных гос органов РК</h1>

<!-- TOP -->
<div class="top-bar">

    <input type="text" id="search" placeholder="Поиск..." onkeyup="filterTable()">

    <button class="add-btn" id="addBtn" onclick="openModal()">+ Добавить</button>

    <button class="search-btn" onclick="openRecognizeModal()">🔍 Поиск человека</button>

</div>

<!-- TABLE -->
<table>
<thead>
<tr>
<th id="checkHead" style="display:none;">☑</th>
<th>Фото</th>
<th>ФИО</th>
<th>Должность</th>
<th>Министерство</th>
<th>Начало</th>
<th>Конец</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">

<h2>Добавить сотрудника</h2>

<div class="form-group">
<input type="text" id="name" placeholder="ФИО">
</div>

<div class="form-group">
<input type="text" id="position" placeholder="Должность">
</div>

<div class="form-group">
<input type="text" id="ministry" placeholder="Министерство">
</div>

<div class="form-group">
<input type="text" id="photoUrl" placeholder="Ссылка на фото">
</div>

<div class="form-group">
<input type="date" id="startDate">
</div>

<div class="form-group">
<input type="date" id="endDate">
</div>

<button class="save-btn" onclick="addPerson()">Сохранить</button>

</div>
</div>

<script>

let data = JSON.parse(localStorage.getItem("gov_data")) || [];

let editMode = false;

/* ROLE */
let role = localStorage.getItem("role") || "user";

function applyRole(){

    if(role !== "admin"){
        document.getElementById("addBtn").style.display = "none";
    }
}
applyRole();

/* TABLE */
function renderTable(rows){

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    rows.forEach((r,i)=>{

        tbody.innerHTML += `
        <tr>
            <td style="display:${editMode ? 'table-cell':'none'}">
                <input type="checkbox">
            </td>

            <td><img src="${r[1]}"></td>
            <td>${r[0]}</td>
            <td>${r[2]}</td>
            <td>${r[3]}</td>
            <td>${r[4]}</td>
            <td>${r[5]}</td>
        </tr>`;
    });
}

/* SEARCH */
function filterTable(){

    const val = document.getElementById("search").value.toLowerCase();

    const filtered = data.filter(r =>
        r.join(" ").toLowerCase().includes(val)
    );

    renderTable(filtered);
}

/* MODAL */
function openModal(){
    document.getElementById("modal").style.display="flex";
}

function addPerson(){

    let name = document.getElementById("name").value;
    let pos = document.getElementById("position").value;
    let min = document.getElementById("ministry").value;
    let img = document.getElementById("photoUrl").value;
    let s = document.getElementById("startDate").value;
    let e = document.getElementById("endDate").value;

    data.push([name,img,pos,min,s,e]);

    localStorage.setItem("gov_data", JSON.stringify(data));

    renderTable(data);
    document.getElementById("modal").style.display="none";
}

/* INIT */
renderTable(data);

</script>

</body>
</html>
