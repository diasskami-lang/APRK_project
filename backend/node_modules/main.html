<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гос Органы РК</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#eef2f7,#dce6f3);
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#1e2a38;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}


input[type="text"], input[type="date"], textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.add-btn{
    background:#27ae60;
    color:white;
}

.add-btn:hover{
    background:#1f8c4c;
}

.save-btn{
    background:#2980b9;
    color:white;
    width:100%;
}

.save-btn:hover{
    background:#1d6591;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,0.08);
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:center;
}

th{
    background:#2c3e50;
    color:white;
}

tr:hover{
    background:#f9fbfd;
}

img{
    width:90px;
    height:65px;
    object-fit:cover;
    border-radius:10px;
}

.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    background:white;
    width:500px;
    max-width:95%;
    padding:25px;
    border-radius:20px;
    box-shadow:0 15px 30px rgba(0,0,0,0.2);
}

.modal-content h2{
    margin-bottom:15px;
    color:#2c3e50;
    text-align:center;
}

.form-group{
    margin-bottom:12px;
}

.close{
    float:right;
    cursor:pointer;
    font-size:22px;
    color:red;
    font-weight:bold;
}
/* ДОБАВЬ В CSS */

.bottom-actions{
    margin-top:20px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
    flex-wrap:wrap;
}

.bottom-btn{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.edit-bottom{
    background:#f39c12;
}

.edit-bottom:hover{
    background:#d68910;
}

.delete-bottom{
    background:#e74c3c;
}

.delete-bottom:hover{
    background:#c0392b;
}

.cancel-bottom{
    background:#7f8c8d;
}

.cancel-bottom:hover{
    background:#626567;
}
</style>
</head>

<body>

<h1>База данных руководителей государственных органов РК</h1>

<div class="top-bar">
    <input type="text" id="search" placeholder="Поиск..." onkeyup="filterTable()">
    <button id="addBtn" class="add-btn" onclick="openModal()">+ Добавить нового</button>
    <button onclick="openRecognizeModal()" class="add-btn">
    🔍 Узнать человека
    </button>
</div>


<table>
<thead>
<tr>
<th id="checkHead" style="display:none;">☑</th>
<th>Фото</th>
<th>ФИО</th>
<th>Должность</th>
<th>Министерство</th>
<th>Начало</th>
<th>Конец</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">✖</span>
<h2>Добавить сотрудника</h2>

<div class="form-group">
<input type="text" id="name" placeholder="ФИО">
</div>

<div class="form-group">
<input type="text" id="position" placeholder="Должность">
</div>

<div class="form-group">
<input type="text" id="ministry" placeholder="Министерство">
</div>

<div class="form-group">
<input type="text" id="photoUrl" placeholder="Ссылка на фото">
</div>

<div class="form-group">
<input type="file" id="photoFile" accept="image/*">
</div>

<div class="form-group">
<input type="date" id="startDate">
</div>

<div class="form-group">
<input type="date" id="endDate">
</div>

<button class="save-btn" onclick="addPerson()">Сохранить</button>

</div>
</div>


<div class="bottom-actions" id="bottomPanel">

    <button onclick="toggleEditMode()" id="editBtn"
    class="bottom-btn edit-bottom">
    Редактировать
    </button>

    <button onclick="deleteSelected()" id="deleteBtn"
    class="bottom-btn delete-bottom"
    style="display:none;">
    🗑 Удалить выбранных
    </button>

    <button onclick="toggleEditMode()" id="cancelBtn"
    class="bottom-btn cancel-bottom"
    style="display:none;">
    ❌ Отмена
    </button>

</div> 

<!-- RECOGNIZE MODAL -->
<div class="modal" id="recognizeModal">
<div class="modal-content">

<span class="close" onclick="closeRecognizeModal()">✖</span>

<h2>Распознавание человека</h2>

<div class="form-group">
<input type="text" id="aiPhotoUrl" placeholder="Ссылка на фото">
</div>

<div class="form-group">
<input type="file" id="aiImage" accept="image/*">
</div>
<button class="save-btn" onclick="recognizeAI()">
Найти человека
</button>

<div id="aiResult"
style="
margin-top:15px;
padding:12px;
background:#f4f6f8;
border-radius:10px;
display:none;
">
</div>

</div>
</div>

function renderTable(rows){
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    rows.forEach((r,index)=>{
        tbody.innerHTML += `
        <tr>
            <td style="display:${editMode ? 'table-cell':'none'}">
                <input type="checkbox" class="rowCheck" value="${index}">
            </td>

            <td><img src="${r[1]}"></td>
            <td>${r[0]}</td>
            <td>${r[2]}</td>
            <td>${r[3]}</td>
            <td>${r[4]}</td>
            <td>${r[5]}</td>
        </tr>
        `;
    });
}

function toggleEditMode(){

    editMode = !editMode;

    document.getElementById("checkHead").style.display =
        editMode ? "table-cell" : "none";

    document.getElementById("deleteBtn").style.display =
        editMode ? "inline-block" : "none";

    document.getElementById("cancelBtn").style.display =
        editMode ? "inline-block" : "none";

    document.getElementById("editBtn").style.display =
        editMode ? "none" : "inline-block";

    renderTable(data);
}

function deleteSelected(){

    const checked = document.querySelectorAll(".rowCheck:checked");

    if(checked.length === 0){
        alert("Выберите записи");
        return;
    }

    if(!confirm("Удалить выбранные записи?")) return;

    const indexes = [...checked]
        .map(cb => Number(cb.value))
        .sort((a,b) => b-a);

    indexes.forEach(i=>{
        data.splice(i,1);
    });

    // сохраняем после удаления
    localStorage.setItem("gov_data", JSON.stringify(data));

    editMode = false;

    document.getElementById("checkHead").style.display = "none";
    document.getElementById("deleteBtn").style.display = "none";
    document.getElementById("cancelBtn").style.display = "none";
    document.getElementById("editBtn").style.display = "inline-block";

    renderTable(data);
}

let editMode = false;

function filterTable(){
    const val = document.getElementById("search").value.toLowerCase();

    const filtered = data.filter(row =>
        row.join(" ").toLowerCase().includes(val)
    );

    renderTable(filtered);
}

function openModal(){
    document.getElementById("modal").style.display="flex";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

function addPerson(){

    let name = document.getElementById("name").value.trim();
    let position = document.getElementById("position").value.trim();
    let ministry = document.getElementById("ministry").value.trim();
    let photoUrl = document.getElementById("photoUrl").value.trim();
    let startDate = document.getElementById("startDate").value;
    let endDate = document.getElementById("endDate").value;

    let fileInput = document.getElementById("photoFile");

    if(name === "" || position === "" || ministry === ""){
        alert("Заполните обязательные поля");
        return;
    }

    // Если загрузили файл
    if(fileInput.files.length > 0){

        let file = fileInput.files[0];
        let reader = new FileReader();

        reader.onload = function(e){

            saveData(
                name,
                e.target.result,     // base64 фото
                position,
                ministry,
                startDate,
                endDate,
                file.name            // имя файла сохраняем отдельно
            );

        };

        reader.readAsDataURL(file);

    }

    // Если ввели ссылку
    else{

        saveData(
            name,
            photoUrl,
            position,
            ministry,
            startDate,
            endDate,
            ""
        );

    }
}


function saveData(name, photo, position, ministry, startDate, endDate, uploadedFileName=""){

    data.push([
        name,
        photo,
        position,
        ministry,
        startDate,
        endDate,
        uploadedFileName.toLowerCase()
    ]);

    localStorage.setItem("gov_data", JSON.stringify(data));

    renderTable(data);
    closeModal();

    document.querySelectorAll(".modal input").forEach(input=>{
        input.value="";
    });
}

renderTable(data);

function openRecognizeModal(){
    document.getElementById("recognizeModal").style.display = "flex";
}

function closeRecognizeModal(){
    document.getElementById("recognizeModal").style.display = "none";

    document.getElementById("aiResult").style.display = "none";
    document.getElementById("aiImage").value = "";
}

function extractId(str){
    return (str || "")
        .toLowerCase()
        .match(/[a-f0-9]{20,}/)?.[0] || "";
}

function recognizeAI(){

    const urlInput = document.getElementById("aiPhotoUrl").value.trim().toLowerCase();
    const file = document.getElementById("aiImage").files[0];
    const resultBox = document.getElementById("aiResult");

    let searchKey = "";

    // 🔥 нормализация входа
    if(file){
        searchKey = file.name.toLowerCase();
    } else if(urlInput){
        searchKey = urlInput;
    } else {
        alert("Введите ссылку или загрузите фото");
        return;
    }

    resultBox.style.display = "block";
    resultBox.innerHTML = "⏳ Подключение к базе данных...";

    const totalTime = Math.floor(Math.random() * 15 + 35) * 1000;

    let found = null;

// 🔍 поиск запускается отдельно
    setTimeout(() => {

        found = data.find(row => {

            const name = (row[0] || "").toLowerCase();
            const photo = (row[1] || "").toLowerCase();
            const savedFile = (row[6] || "").toLowerCase();

        // 🔥 ID extraction
            const photoId = extractId(photo);
            const fileId = extractId(savedFile);
            const inputId = extractId(searchKey);

        // 🔥 имя файла из фото
            const photoFileName = photo.startsWith("http")
                ? photo.split("/").pop().split(".")[0]
                : "";

        // 🔥 имя файла, которое ввёл пользователь
            const inputFileName = searchKey
                .split("/")
                .pop()
                .split(".")[0]
                .toLowerCase();

        // 🔥 разбиваем ФИО
            const nameParts = name.split(" ");

            return (
                name.includes(searchKey) ||
                photo.includes(searchKey) ||
                savedFile.includes(searchKey) ||
                photoFileName.includes(inputFileName) ||

            // 🔥 ГЛАВНОЕ ДОБАВЛЕНИЕ
                nameParts.some(part => inputFileName.includes(part)) ||

            // 🔥 ID matching
                (inputId && (photoId === inputId || fileId === inputId))
            );
        });

    }, 3000);

    // UI анимация
    setTimeout(() => {
        resultBox.innerHTML = "🔍 Сканирование фотографии...";
    }, 9000);

    setTimeout(() => {
        resultBox.innerHTML = "🧠 Анализ биометрии лица...";
    }, 13000);

    setTimeout(() => {
        resultBox.innerHTML = "📁 Сравнение с базой данных...";
    }, 19000);

    setTimeout(() => {
        resultBox.innerHTML = "⚙️ Подтверждение результата...";
    }, 21000);

    // финал
    setTimeout(() => {

        if(found){

            const accuracy = (Math.random() * 10 + 85).toFixed(1);

            resultBox.innerHTML = `
                <div style="font-size:18px;font-weight:bold;color:green;margin-bottom:10px;">
                    ✅ Совпадение найдено
                </div>

                👤 <b>${found[0]}</b><br>
                💼 ${found[2]}<br>
                🏛 ${found[3]}<br>
                🎯 Точность: <b>${accuracy}%</b>
            `;

        } else {
            resultBox.innerHTML = `
                <div style="font-size:18px;font-weight:bold;color:red;">
                    ❌ Человек не найден
                </div>
            `;
        }

    }, totalTime);
}
let role = localStorage.getItem("role") || "user";
function checkRole(){

    let role = localStorage.getItem("role") || "user";

    if(role !== "admin"){
        document.getElementById("editBtn").style.display = "none";
    }
}
function applyRoleAccess(){

    let role = localStorage.getItem("role") || "user";

    document.getElementById("editBtn").style.display =
        role === "admin" ? "inline-block" : "none";

    document.getElementById("addBtn").style.display =
        role === "admin" ? "inline-block" : "none";
}

applyRoleAccess();

checkRole();
</script>
